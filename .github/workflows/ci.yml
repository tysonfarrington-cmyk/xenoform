name: smoke

on:
  push:
  pull_request:

jobs:
  install-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fresh virtualenv
        run: python -m venv .venv
      - name: Install the node pack the way ComfyUI Manager does
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e ".[dev]"
      - name: Import, node registration, /xenoform, tiny dry-run
        run: .venv/bin/pytest tests/test_install.py
      - name: Open-weights default workflows
        run: .venv/bin/pytest tests/test_eligibility.py
      - name: Full suite
        run: .venv/bin/pytest
