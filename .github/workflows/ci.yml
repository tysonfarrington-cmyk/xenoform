name: smoke

on:
  push:
  pull_request:

jobs:
  install-and-smoke:
    # Pinned: ubuntu-latest moved to 26.04 (a newer ffmpeg) in Nov 2026 and reddened the suite without a change here.
    runs-on: ubuntu-24.04
    # The whole job takes about twenty minutes. A test that waited for good held it for GitHub's own six hours on
    # 21 Nov 2026.
    timeout-minutes: 45
    env:
      # No seed-clip download from NASA while the tests run.
      XENO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fresh virtualenv
        run: python -m venv .venv
      - name: Install the desk and the node pack (ComfyUI-Manager installs requirements.txt, which lists nothing)
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-desk.txt
          .venv/bin/pip install -e ".[dev,agent]"
      - name: Import, node registration, /xenoform, tiny dry-run
        run: .venv/bin/pytest tests/test_install.py
      - name: Open-weights default workflows
        run: .venv/bin/pytest tests/test_eligibility.py
      - name: Full suite (the two steps above are not run again)
        # faulthandler_timeout: a test still running after ten minutes has every thread's stack written to the log, so
        # a test that stops names itself and the line it stopped on (pytest -q alone left only a row of dots).
        run: .venv/bin/pytest -o faulthandler_timeout=600 --ignore=tests/test_install.py --ignore=tests/test_eligibility.py
